[project]
name = "tttmem"
version = "0.1.0"
description = "Code for 'What Second-Order Meta-Gradients Buy in TTT-E2E': first- vs second-order TTT-E2E meta-gradients on toy tasks and text"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pyarrow>=18",
    "setproctitle>=1.3.8",
    "tokenizers>=0.21",
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tttmem"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
