# E1-VE-D3: eval-only split of the write size on the 60 wave-1 checkpoints.
# At every E and C write: logit residual ||g||, read-out gain ||delta||/||g||, activation ||a|| (and ||a0||
# under W0), value probabilities, and the key response of the C input to the location's E key.
# Predictions V1, V2, N0 were registered before the run.
experiment = "ve_write"
seed = 0

[ve_write]
process_name = "TTM-vd3-01"
device = "cpu"
threads = 8
ckpt_dir = "outputs/e1-ve/checkpoints"
reference_csv = "outputs/e1-ve/data/cells.csv"
n_eval = 256
eval_batch = 32
