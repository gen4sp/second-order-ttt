# E1-VE GPU smoke: one short cell per arm at the harder eta with slip.
# Generated by scripts/e1ve_configs.py.
experiment = "ve"
seed = 0

[ve]
process_name = "TTM-ve-09-smoke"
device = "cuda"
workers = 5
max_minutes = 10
# fp32 IEEE matmuls: the step is not matmul-bound at d=128
tf32 = false
fused_adam = true
compile_backbone = false
steps = 50
quick_every = 25
n_eval = 32
save_final = false
cells = [
  { order = "so", rule = "ce", eta = 40, slip = 0.03, seed = 99 },
  { order = "fo", rule = "aice", eta = 40, slip = 0.03, seed = 99 },
  { order = "fo", rule = "linev", eta = 40, slip = 0.03, seed = 99 },
  { order = "fo", rule = "ce", eta = 40, slip = 0.03, seed = 99 },
  { order = "fo", rule = "ce", edge = true, eta = 40, slip = 0.03, seed = 99 },
]
