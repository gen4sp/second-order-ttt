# P2-1: FO arms use the SO fallback setting (attempt = 1, peak 1e-3).
experiment = "p2"
seed = 0

[p2]
mode = "train"
process_name = "TTM-p21-06-e2e1-aice"
arm = "e2e1-aice"
init = "data/ckpt/init.pt"
init_label = "P2-1: official 8K init"
data_dir = "data/p2data"
out_dir = "outputs/p21/e2e1-aice/attempt1"
preset = "125m"
device = "cuda"
dtype = "bf16"
seq_len = 8192
global_batch = 64
micro_batch = 2
steps = 400
warmup = 30
inner_warmup = 1
lr_floor = 1e-5
lr_peak = 1e-3
attempt = 1
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
grad_clip = 1.0
inner_lr = 1.0
inner_clip = 1.0
rule_lr_scale = { lin = 0.5, aice = 0.5 }  # A6 calibration: norm-matched to CE
trunc_kv = false
fused_attn = true
so_fused_forward = false
train_split = "A"
data_seed = 0
n_eval = 3072
trajectory_docs = 256
ho_docs = 512
ho_trajectory_docs = 128
eval_batch = 4
eval_steps = [0, 30, 60, 100, 200, 400]
full_eval_steps = [0, 400]
sizing_steps = [60]
pilot_steps = []
pilot_docs = 64
crossover_rules = ["ce", "lin", "aice"]
assay_gate = true
resume_every = 25
resume = false
log_every = 10
save_checkpoints = true
