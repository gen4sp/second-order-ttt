experiment = "p2"
seed = 0

[p2]
mode = "train"
process_name = "TTM-p21-03-e2e2"
arm = "e2e2"
init = "data/ckpt/init.pt"
init_label = "P2-1: official 8K init"
data_dir = "data/p2data"
out_dir = "outputs/p21/e2e2/attempt0"
preset = "125m"
device = "cuda"
dtype = "bf16"
seq_len = 8192
global_batch = 64
micro_batch = 1
steps = 400
warmup = 30
inner_warmup = 1
lr_floor = 1e-5
lr_peak = 3e-3
attempt = 0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.1
grad_clip = 1.0
inner_lr = 1.0
inner_clip = 1.0
trunc_kv = false
fused_attn = true
so_fused_forward = false
train_split = "A"
data_seed = 0
n_eval = 3072
trajectory_docs = 256
ho_docs = 512
ho_trajectory_docs = 128
eval_batch = 4 # measured best batch on RTX 5090; batch 16 OOM
eval_steps = [0, 30, 60, 100, 200, 400]
full_eval_steps = [0, 400]
sizing_steps = [60]
pilot_steps = [10, 20, 30, 40, 50, 60]
pilot_docs = 64
pilot_max_rise = 0.10
crossover_rules = ["ce", "lin", "aice"] # remove aice if A2 drops it, before SO launch
assay_gate = true
resume_every = 25
resume = false
log_every = 10
save_checkpoints = true
