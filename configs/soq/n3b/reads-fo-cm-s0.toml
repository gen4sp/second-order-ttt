# SOQ-N3B step 3 of 3: the two-sided frontier reads, eval-only, mini_g0 machinery.
# Documents as G0: M on the first 1024 eligible eval documents, adapted L on the first 128 ho documents
# (CAL = even, TEST = odd, in the analysis); H_LM (no-adapt, η-independent) on the 256 ho documents of
# the training-layout eval, once per checkpoint at the arm's operating checkpoint.  Per read npz:
# M_doc, fP_focal, fP_nonfocal, L_adapt_sum / L_adapt_count, clip-binding per document (clip_bind_fP_*,
# L_clip_bind_doc) and κ (kz_* centred logits, klp_* log-probs: probe-row K x |Y_doc| matrices, foils,
# per-probe n_src / y_mult / segment; G0_KAPPA line).  Reads named etaNNN are plain CE at η x NNN/100,
# so the adaptive top (eta800, eta1000, eta1200, eta1600) and refinement midpoints (e.g. eta160,
# eta450) are config-only additions to an item's ``reads``.
#
# Hard parity (G0_PARITY, |ΔM| <= 1e-3, |ΔL| <= 2e-4 against the stored G0 reads, same documents):
# SO x1 (G0) and x1.5 (G0c), FO-CE x1 (G0) and x3 (G0b).  A failure stops that item.
#
# Groups (run_groups selects; default all): "existing" = SO and FO-CE at 1200 (can run on a second GPU while
# FO-CM trains; no N_CM needed); "focm-s0/1/2" = FO-CM at N_CM (+ descriptive 1200 / 2400), needing the
# FO-CM run outputs and its n_cm.json.  Per-job files: configs/soq/n3b/.
#
# GPU time (RTX 4090, 157-166 s per read as measured in G0/G0b/G0c, + ~1 min per item setup, + κ ≈ 3 %):
#   existing: 3 x (8 SO + 7 FO-CE) = 45 reads ≈ 2.2 h; FO-CM: 3 x (11 + 1 + 3) = 45 reads ≈ 2.2 h;
#   H_LM 9 x ~0.5 min.  Total ≈ 4.5 GPU-h (+ ~3 min per adaptive top / refinement read).
experiment = "p2"
seed = 0

[p2]
run_groups = ["focm-s0"]
mode = "soq_n3b_reads"
process_name = "TTM-n3b-41-reads-s0"
process_nn = 5                # G0 accepts 1..9 only; the process name stays TTM-n3b-41-*
data_dir = "data/p2data"
device = "cuda"
out_dir = "outputs/mini/matrix/n3b-reads"
n_cm_file = "outputs/mini/matrix/n3b/n_cm.json"
max_hours = 1.4
n_docs = 1024
n_ho_adapt = 128
sigma_cap = 4.0
kappa_reads = "all"
kappa_foils = 8
kappa_boot = 10000
kappa_boot_seed = 0
parity_tol_M = 1e-3
parity_tol_L = 2e-4
setup_cache = true
production_configs = { "mini-m/e2e2" = "configs/mini/e2e2-m.toml", "mini-m/e2e1-ce" = "configs/mini/e2e1-ce-m.toml" }

[[p2.items]]
group = "existing"
cell = "mini-m/so/s0"
preset = "mini-m"
arm = "e2e2"
init_seed = 0
data_seed = 0
step = 1200
ckpt = "outputs/mini/matrix/g43/runs/mini-m/e2e2/s0/model_step1200.pt"
out = "outputs/mini/matrix/n3b-reads/mini-m/so/s0"
reads = ["ce", "eta090", "eta110", "eta125", "eta150", "eta175", "eta200", "eta250", "eta300"]
g0_ref = { ce = "outputs/mini/matrix/g0/mini-m/e2e2/s0/g0_read_ce.npz", eta150 = "outputs/mini/matrix/g0c/mini-m/e2e2/s0/g0_read_eta150.npz", eta200 = "outputs/mini/matrix/g0/mini-m/e2e2/s0/g0_read_eta200.npz" }
hlm = true
estimate_wall_s = 1450

