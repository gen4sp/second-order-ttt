experiment = "ttt"
seed = 0

[ttt]
quick_par = true
process_name = "TTM-r3-01"
device = "auto"
max_minutes = 60
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
n_bins = 16
g_clip = 10.0
late_frac = 0.25
eta_lr = 0.01
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.01
warmup = 200
lr_floor = 0.1
grad_clip = 1.0
batch = 32
quick_every = 500
cells = [
  # R3: echo_off binding test, interleaved by seed so a time-budget
  # stop keeps the three arms balanced; diagnostics on every echo_off cell.
  { task = "echo_off", seed = 0, arm = "e2e2", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 0, arm = "jac2so", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 0, arm = "e2e1", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 1, arm = "e2e2", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 1, arm = "jac2so", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 1, arm = "e2e1", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 2, arm = "e2e2", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 2, arm = "jac2so", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 2, arm = "e2e1", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 3, arm = "e2e2", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 3, arm = "jac2so", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 3, arm = "e2e1", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 4, arm = "e2e2", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 4, arm = "jac2so", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 4, arm = "e2e1", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 5, arm = "e2e2", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 5, arm = "jac2so", eta_base = 10, steps = 2000, tag = "R3 binding" },
  { task = "echo_off", seed = 5, arm = "e2e1", eta_base = 10, steps = 2000, tag = "R3 binding" },
  # Story B loophole: does any eta rescue first order on echo (R2b echo settings)?
  { task = "echo", seed = 0, arm = "e2e1", eta_base = 3, steps = 1500, tag = "eta rescue", diag = false },
  { task = "echo", seed = 1, arm = "e2e1", eta_base = 3, steps = 1500, tag = "eta rescue", diag = false },
  { task = "echo", seed = 2, arm = "e2e1", eta_base = 3, steps = 1500, tag = "eta rescue", diag = false },
  { task = "echo", seed = 0, arm = "e2e1", eta_base = 30, steps = 1500, tag = "eta rescue", diag = false },
  { task = "echo", seed = 1, arm = "e2e1", eta_base = 30, steps = 1500, tag = "eta rescue", diag = false },
  { task = "echo", seed = 2, arm = "e2e1", eta_base = 30, steps = 1500, tag = "eta rescue", diag = false },
  # lr control: echo e2e2 at the echo_off stabiliser lr (seeds that bound in R2b), so
  # an echo_off 'not learned' can be told apart from 'lr 5e-4 is too slow'.
  { task = "echo", seed = 0, arm = "e2e2", eta_base = 10, steps = 2000, lr = 5e-4, lr_total = 4000, tag = "lr control", diag = false },
  { task = "echo", seed = 3, arm = "e2e2", eta_base = 10, steps = 2000, lr = 5e-4, lr_total = 4000, tag = "lr control", diag = false },
  { task = "echo", seed = 5, arm = "e2e2", eta_base = 10, steps = 2000, lr = 5e-4, lr_total = 4000, tag = "lr control", diag = false },
]


[ttt.icl_mc]
T = 1024
n_vocab = 32
alpha = 0.1
steps = 4000
n_eval = 512
n_val = 128
n_quick_eval = 64
eval_batch = 32

[ttt.echo]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 50
# the 1500-step cells follow the first half of the round-1 3000-step lr schedule
lr_total = 3000

[ttt.echo_ctrl]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 250

[ttt.echo_off]
T = 640
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 50
prefix_min = 64
prefix_max = 192

# R3: peak lr halved for every echo_off arm (end-of-warmup collapse mitigation, untested);
# 2000-step cells follow the first half of a 4000-step schedule, as R2b did for echo
lr = 5e-4
lr_total = 4000

[ttt.echo_ctrl_nor]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 250
