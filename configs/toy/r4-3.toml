experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r43-01"
device = "auto"
workers = 6
max_minutes = 180
# TF32 off: the in-run S5 (linear W2 decomposition vs the direct kv streaming eval)
# must hold at 1e-4 in fp32, so both TF32 flags and the float32 matmul precision are
# pinned to fp32 in every worker and asserted there.
tf32 = false
# torch's MPS fraction is relative to Metal's recommendedMaxWorkingSetSize (logged per
# worker as MPS_CAP), not to RAM. Unused on CUDA; kept from R4-2.
mps_memory_fraction = 0.20
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 1500
batch = 32
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
lr = 0.001
lr_total = 3000
warmup = 200
lr_floor = 0.1
eta_lr = 0.01
grad_clip = 1.0
g_clip = 10.0
quick_every = 25
probe_every = 25
n_probe = 32
# first-order arms checkpoint 200/300/500/1000; a second-order arm (e2e2, e2e2emb,
# e2e2_kvm) takes that list plus 100, i.e. 100/200/300/500/1000. The harness unions
# the two lists for second-order arms (R4-2 semantics), so 500 is a superset of
# the registered 100/200/300/1000. There is no dense window: the 25-step probe grid
# already logs p_kv, e_kv_abs, kv_write_eff, addr_a and all four etas over steps 150-400.
checkpoint_steps = [200, 300, 500, 1000]
checkpoint_steps_so = [100]
# 90 cells, seed-major with the S2 pair (e2e2, e2e2_kvm) first so a time-budget stop keeps
# whole seed groups and the interleaved second-order pairs.
cells = [
  { task = "echo", seed = 0, arm = "e2e2", eta_base = 10, diag = false },
  { task = "echo", seed = 0, arm = "e2e2_kvm", eta_base = 10, diag = false },
  { task = "echo", seed = 0, arm = "e2e1emb", eta_base = 10, diag = false },
