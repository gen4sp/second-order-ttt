experiment = "lod"
seed = 0

[lod]
mode = "production"
process_name = "TTM-lod-80"
device = "cuda"
output_dir = "outputs_lod"
smoke_output_dir = "outputs_lod_podsmoke"
smoke_receipt = "outputs/lod-gpu-smoke/rates.json"
workers = 5
threads_per_worker = 2
tf32 = false
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
pool = 256
n_probe = 16
events_per_chunk = 16
gap = 268
control_load = 128
steps = 1500
batch = 32
n_eval = 512
n_quick_eval = 64
n_geometry = 128
eval_batch = 32
log_every = 25
lr = 0.001
eta_lr = 0.0
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.01
warmup = 200
lr_total = 3000
lr_floor = 0.1
grad_clip = 1.0
g_clip = 10.0
budget_usd = 5.0  # spend cap read by tier_rule
hourly_usd = 0.50  # hourly GPU price assumed by tier_rule (RTX 3090)
setup_hours = 0.45
shutdown_minutes = 5.0
eval_factor = 1.08
vocab_factor = 1.05
diagnostic_factor = 1.03
tier_order = ["T1", "T2", "T3", "T4", "T5"]
tier_rule = "first projected session cost <= budget; measured smoke rates only; fixed before production"
addon_rule = "T1 plus addon and allowance <= budget"

[lod.tiers.T1]
core_seeds = 12
aice_seeds = 8
control_seeds = 8
anchor_seeds = 4
bridge_seeds = 4
cells = 160
evaluable = ["H1a", "H1b", "H1c", "H1d", "H1i", "H2", "H3a", "H3b", "H4", "Bridge", "H5"]
[lod.tiers.T2]
core_seeds = 12
aice_seeds = 6
control_seeds = 8
anchor_seeds = 4
bridge_seeds = 4
cells = 152
evaluable = ["H1a", "H1b", "H1c", "H1d", "H1i", "H2", "H3a", "H3b", "H4", "Bridge", "H5"]
[lod.tiers.T3]
core_seeds = 12
aice_seeds = 0
control_seeds = 8
anchor_seeds = 4
bridge_seeds = 4
cells = 128
evaluable = ["H1a", "H1b", "H1c", "H1d", "H1i", "H2", "H4", "Bridge", "H5"]
holm_family = ["H2"]
[lod.tiers.T4]
core_seeds = 8
aice_seeds = 8
control_seeds = 8
anchor_seeds = 4
bridge_seeds = 4
cells = 128
evaluable = ["H1a", "H1b", "H1c", "H1d", "H1i", "H2", "H3a", "H3b", "H4", "Bridge", "H5"]
[lod.tiers.T5]
core_seeds = 8
aice_seeds = 6
control_seeds = 8
anchor_seeds = 4
bridge_seeds = 4
cells = 120
evaluable = ["H1a", "H1b", "H1c", "H1d", "H1i", "H2", "H3a", "H3b", "H4", "Bridge", "H5"]
[lod.tiers.cheap]
