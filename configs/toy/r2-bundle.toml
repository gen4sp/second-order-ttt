experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r2-01"
device = "auto"
max_minutes = 85
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
n_bins = 16
g_clip = 10.0
late_frac = 0.25
eta_lr = 0.01
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.01
warmup = 200
lr_floor = 0.1
grad_clip = 1.0
batch = 32
quick_every = 500
cells = [
  { task = "echo", seed = 0, arm = "e2e2", eta_base = 10, steps = 3000, tag = "anchor", gate_min_acc = 0.9 },
  { task = "echo_off", seed = 0, arm = "swa", steps = 3000, tag = "leak check" },
  { task = "echo_off", seed = 0, arm = "e2e2", eta_base = 10, steps = 3000, tag = "R2-2 layout" },
  { task = "echo_off", seed = 0, arm = "e2e1", eta_base = 10, steps = 3000, tag = "R2-2 layout" },
  { task = "echo_off", seed = 0, arm = "jac2so", eta_base = 10, steps = 3000, tag = "R2-2" },
  { task = "icl_mc", seed = 0, arm = "jac2so", eta_base = 0.3, steps = 4000, tag = "R2-2 main" },
  { task = "echo", seed = 1, arm = "e2e2", eta_base = 10, steps = 3000, tag = "replication", run_if_gate_fails = true },
  { task = "echo", seed = 1, arm = "e2e1", eta_base = 10, steps = 3000, tag = "replication" },
  { task = "echo", seed = 2, arm = "e2e2", eta_base = 10, steps = 3000, tag = "replication", run_if_gate_fails = true },
  { task = "echo", seed = 2, arm = "e2e1", eta_base = 10, steps = 3000, tag = "replication" },
  { task = "echo_off", seed = 1, arm = "e2e2", eta_base = 10, steps = 3000, tag = "echo_off replication" },
  { task = "echo", seed = 0, arm = "e2e1", eta_base = 3, steps = 3000, tag = "eta rescue?" },
  { task = "echo", seed = 0, arm = "e2e1", eta_base = 30, steps = 3000, tag = "eta rescue?" },
  { task = "echo_ctrl", seed = 0, arm = "e2e1", eta_base = 3, steps = 3000, tag = "R2-1" },
  { task = "echo_ctrl", seed = 0, arm = "e2e2", eta_base = 3, steps = 3000, tag = "R2-1" },
  { task = "echo_ctrl", seed = 0, arm = "e2e1", eta_base = 10, steps = 3000, tag = "R2-1" },
  { task = "echo_ctrl", seed = 0, arm = "e2e2", eta_base = 10, steps = 3000, tag = "R2-1" },
  { task = "echo_ctrl", seed = 0, arm = "e2e1", eta_base = 30, steps = 3000, tag = "R2-1" },
  { task = "echo_ctrl", seed = 0, arm = "e2e2", eta_base = 30, steps = 3000, tag = "R2-1" },
  { task = "echo_ctrl_nor", seed = 0, arm = "e2e1", eta_base = 10, steps = 3000, tag = "R2-1 no-r control" },
  { task = "echo_ctrl_nor", seed = 0, arm = "e2e2", eta_base = 10, steps = 3000, tag = "R2-1 no-r control" },
  { task = "echo_ctrl", seed = 0, arm = "e2e2", eta_base = 10, steps = 6000, tag = "late-jump guard" },
  { task = "echo_off", seed = 0, arm = "e2e2", eta_base = 3, steps = 3000, tag = "eta sensitivity" },
  { task = "echo", seed = 0, arm = "e2e2", eta_base = 10, steps = 3000, tag = "R2-1c framing check", inner_sign = -1 },
]

[ttt.icl_mc]
T = 1024
n_vocab = 32
alpha = 0.1
steps = 4000
n_eval = 512
n_val = 128
n_quick_eval = 64
eval_batch = 32

[ttt.echo]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 250

[ttt.echo_ctrl]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 250

[ttt.echo_off]
T = 640
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 250
prefix_min = 64
prefix_max = 192

[ttt.echo_ctrl_nor]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
quick_every = 250
