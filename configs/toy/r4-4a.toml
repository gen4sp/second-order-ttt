experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r44a-02"
device = "auto"
workers = 6
max_minutes = 120
# TF32 off for matmul and cuDNN, asserted and logged by every worker before any
# allocation, so the in-run S5 identity check holds at 1e-4.
tf32 = false
# torch's MPS fraction is relative to Metal's recommendedMaxWorkingSetSize (logged per
# worker as MPS_CAP), not to RAM. The run is on CUDA, where this key is inert; it is
# kept so an accidental local MPS launch is still capped.
mps_memory_fraction = 0.20
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 1500
batch = 32
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
lr = 0.001
lr_total = 3000
warmup = 200
lr_floor = 0.1
eta_lr = 0.01
grad_clip = 1.0
g_clip = 10.0
quick_every = 25
probe_every = 25
n_probe = 32
# R4-4a: all finals; dense acquisition/loss and Kamin switch windows at seeds 0-4.
kamin_switch = 500
copy_noise_q = [0.99, 0.97, 0.95, 0.90]
rf_probability = 0.05
kv_eta_lr = 0.01
kv_eta10_lr = 0.1
d1_n_eval = 256
checkpoint_steps = []
checkpoint_dense = [150, 175, 200, 225, 250, 275, 300, 325, 350, 375, 400]
