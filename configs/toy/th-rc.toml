experiment = "ttt"
seed = 0

# TH-RC: fixed-eta regime check (theory branches A and B).
# eta_lr = 0 freezes rho at 0, so eta = eta_base for the whole run (shared by all fast tensors).
# Pre-registered test: prediction P2 (+ SO companion).
