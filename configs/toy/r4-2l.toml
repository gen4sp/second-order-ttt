experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r42L-02"
device = "auto"
workers = 6
max_minutes = 120
# TF32 off for matmul and cuDNN, asserted and logged by every worker before any
# allocation, so the in-run S5 identity check holds at 1e-4.
tf32 = false
# torch's MPS fraction is relative to Metal's recommendedMaxWorkingSetSize (logged per
# worker as MPS_CAP), not to RAM. The run is on CUDA, where this key is inert; it is
# kept so an accidental local MPS launch is still capped.
mps_memory_fraction = 0.20
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 1500
batch = 32
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
lr = 0.001
lr_total = 3000
warmup = 200
lr_floor = 0.1
eta_lr = 0.01
grad_clip = 1.0
g_clip = 10.0
quick_every = 25
probe_every = 25
n_probe = 32
# Checkpoints: the base list for every arm, the dense 25-step window
# over 150-400 for three arms at seeds 0-4, and three extra steps for w600 only.
checkpoint_steps = [100, 200, 250, 300, 500, 1000]
checkpoint_steps_so = [50, 150, 200, 300, 1000]
checkpoint_dense = [150, 175, 200, 225, 250, 275, 300, 325, 350, 375, 400]
checkpoint_dense_arms = ["e2e1emb", "e2e1emb_linkv", "e2e1emb_w600"]
checkpoint_dense_max_seed = 4
checkpoint_arm_steps = [{ arm = "e2e1emb_w600", steps = [600, 700, 800] }]
