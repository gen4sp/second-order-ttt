experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r1-01"
device = "auto"
max_minutes = 110.0
tasks = ["icl_mc", "echo", "echo_ctrl"]
seeds = [0]
arms = ["fa", "swa", "naive", "e2e2", "e2e1", "jac1", "jac2"]
# The seed-1 extras run last, so a time-budget stop costs the least important runs.
extra_jobs = [{ task = "icl_mc", seed = 1, arms = ["swa", "e2e1", "e2e2"] }]

# model (identical parameter counts in every arm; only the mask and the head role differ)
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
n_bins = 16
g_clip = 10.0
late_frac = 0.25

# inner loop
pilot = true
pilot_etas = [0.3, 1.0, 3.0, 10.0]
pilot_steps = 300
eta_lr = 0.01
naive_etas = [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]

# optimisation (shared by every arm, so the seed and data stream are the only
# differences between them)
lr = 1e-3
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.01
warmup = 200
lr_floor = 0.1
grad_clip = 1.0
batch = 32
quick_every = 500

# task 1: in-context Markov chains, exact Bayes ceiling available
[ttt.icl_mc]
arms = ["fa", "swa", "naive", "e2e2", "e2e1", "jac1", "jac2"]
T = 1024
n_vocab = 32
alpha = 0.1
steps = 4000
n_eval = 512
n_val = 128
n_quick_eval = 64
eval_batch = 32

# tasks 2 and 3: echo-recall and its control; V = 2 + 3 * n_keys = 50 is implied
[ttt.echo]
arms = ["fa", "swa", "e2e1", "e2e2", "jac2"]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32

[ttt.echo_ctrl]
arms = ["fa", "swa", "e2e1", "e2e2", "jac2"]
T = 512
steps = 3000
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32