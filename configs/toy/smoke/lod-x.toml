experiment = "lod"
seed = 0

[lod]
protocol = "lodx"
mode = "diagnostic"
process_name = "TTM-lodx-74"
device = "cpu"
output_dir = "outputs_lodx_smoke"
workers = 1
threads_per_worker = 2
tf32 = false
d_model = 16
n_layers = 1
n_heads = 2
backbone_mult = 2
fast_mult = 2
window = 16
chunk = 16
pool = 64
loads = [16, 32, 64]
n_probe = 4
events_per_chunk = 4
gap = 68
control_load = 128
steps = 6
full_eval_steps = [3, 6]
batch = 2
n_eval = 4
n_quick_eval = 4
n_geometry = 4
eval_batch = 2
log_every = 1
lr = 0.001
eta_lr = 0.0
warmup = 2
lr_total = 30
lr_floor = 0.1
grad_clip = 1.0
g_clip = 10.0
