experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r2b-01-smoke"
device = "cpu"
max_minutes = 60
d_model = 16
n_layers = 1
n_heads = 2
backbone_mult = 2
fast_mult = 2
window = 8
chunk = 8
n_bins = 4
g_clip = 10.0
batch = 2
n_eval = 2
n_quick_eval = 2
eval_batch = 2
warmup = 2
quick_every = 2
cells = [
  # R2b: seeds are the unit on echo. Interleaved by seed so a
  # time-budget stop keeps the e2e1/e2e2 comparison balanced; diagnostics on seeds 0-1 only.
  { task = "echo", seed = 0, arm = "e2e2", eta_base = 10, steps = 4, tag = "seeds-as-unit" },
  { task = "echo", seed = 0, arm = "e2e1", eta_base = 10, steps = 4, tag = "seeds-as-unit" },
  { task = "echo", seed = 1, arm = "e2e2", eta_base = 10, steps = 4, tag = "seeds-as-unit" },
  { task = "echo", seed = 1, arm = "e2e1", eta_base = 10, steps = 4, tag = "seeds-as-unit" },
  { task = "echo", seed = 2, arm = "e2e2", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "echo", seed = 2, arm = "e2e1", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "echo", seed = 3, arm = "e2e2", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "echo", seed = 3, arm = "e2e1", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "echo", seed = 4, arm = "e2e2", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "echo", seed = 4, arm = "e2e1", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "echo", seed = 5, arm = "e2e2", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "echo", seed = 5, arm = "e2e1", eta_base = 10, steps = 4, tag = "seeds-as-unit", diag = false },
  { task = "icl_mc", seed = 0, arm = "jac2so", eta_base = 0.3, steps = 4, tag = "R2-2 main" },
  # spike probe: drop the update when the outer norm exceeds 10x the median of the previous 50
  { task = "echo", seed = 0, arm = "e2e2", eta_base = 10, steps = 4, spike_skip = 10, tag = "spike skip", diag = false },
  { task = "echo", seed = 1, arm = "e2e2", eta_base = 10, steps = 4, spike_skip = 10, tag = "spike skip", diag = false },
  { task = "echo", seed = 2, arm = "e2e2", eta_base = 10, steps = 4, spike_skip = 10, tag = "spike skip", diag = false },
  { task = "echo", seed = 3, arm = "e2e2", eta_base = 10, steps = 4, spike_skip = 10, tag = "spike skip", diag = false },
  { task = "echo", seed = 4, arm = "e2e2", eta_base = 10, steps = 4, spike_skip = 10, tag = "spike skip", diag = false },
  { task = "echo", seed = 5, arm = "e2e2", eta_base = 10, steps = 4, spike_skip = 10, tag = "spike skip", diag = false },
]

[ttt.icl_mc]
T = 24
n_vocab = 8
alpha = 0.1

[ttt.echo]
T = 64
n_keys = 4

lr_total = 8
[ttt.echo_ctrl]
T = 64
n_keys = 4

[ttt.echo_off]
T = 80
n_keys = 4
prefix_min = 16
prefix_max = 24

[ttt.echo_ctrl_nor]
T = 64
n_keys = 4
