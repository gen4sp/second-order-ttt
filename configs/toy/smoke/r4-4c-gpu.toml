data_seed_offset = 50000
eval_seed = 991
T = 512
n_keys = 16
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
n_probe = 32
quick_every = 10
probe_every = 10
