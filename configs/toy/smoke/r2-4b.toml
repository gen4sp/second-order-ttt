experiment = "kag"
seed = 0

[kag]
process_name = "TTM-kag-00-smoke"
device = "cpu"
smoke = true
ckpt_root = "outputs"
checkpoints = [
  { path = "r2b/checkpoints/echo__s0__e2e2__eta10__st1500.pt", arm = "e2e2", eta_base = 10, ref = 1.0, label = "r2b-e2e2-s0" },
  { path = "r2b/checkpoints/echo__s0__e2e1__eta10__st1500.pt", arm = "e2e1", eta_base = 10, ref = 0.13208, label = "r2b-e2e1-s0" },
]

[kag.echo]
T = 512
n_keys = 16
n_eval = 32
eval_batch = 32

[kag.echo_ctrl]
T = 512
n_keys = 16
n_eval = 32
eval_batch = 32

[kag.echo_ctrl_nor]
T = 512
n_keys = 16
n_eval = 32
eval_batch = 32

[kag.echo_off]
T = 640
n_keys = 16
n_eval = 32
eval_batch = 32
prefix_min = 64
prefix_max = 192
