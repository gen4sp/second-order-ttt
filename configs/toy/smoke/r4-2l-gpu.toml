experiment = "ttt"
seed = 0

# Pre-full-run GPU smoke (as in R4-3): the seven R4-2L arms at seed 0, 100 steps, under
# six-way worker contention on the RTX 5080. It confirms TF32 off in every worker, the
# in-run sanity L1-L8 and S5 on CUDA, the lin paths, checkpoints and peak CUDA memory,
# and gives the real ms/step. These cells do not count as results.

[ttt]
process_name = "TTM-r42L-00-podsmoke"
device = "auto"
workers = 6
max_minutes = 30
# TF32 off for matmul and cuDNN, asserted and logged by every worker before any
# allocation, so the in-run S5 identity check holds at 1e-4.
tf32 = false
# torch's MPS fraction is relative to Metal's recommendedMaxWorkingSetSize (logged per
# worker as MPS_CAP), not to RAM. The run is on CUDA, where this key is inert; it is
# kept so an accidental local MPS launch is still capped.
mps_memory_fraction = 0.20
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 100
batch = 32
n_keys = 16
n_eval = 64
n_val = 16
n_quick_eval = 32
eval_batch = 32
lr = 0.001
lr_total = 3000
warmup = 200
lr_floor = 0.1
eta_lr = 0.01
grad_clip = 1.0
g_clip = 10.0
quick_every = 25
probe_every = 25
n_probe = 32
# Checkpoints pulled back into the 100-step window so every list (base, dense, w600
# extra) is exercised on CUDA; the run's lists start at 100-150.
checkpoint_steps = [50, 100]
checkpoint_steps_so = [25, 50]
checkpoint_dense = [50, 75]
checkpoint_dense_arms = ["e2e1emb", "e2e1emb_linkv", "e2e1emb_w600"]
checkpoint_dense_max_seed = 0
checkpoint_arm_steps = [{ arm = "e2e1emb_w600", steps = [60] }]
cells = [
  { task = "echo", seed = 0, arm = "e2e1emb", eta_base = 10, diag = false },
  { task = "echo", seed = 0, arm = "e2e1emb_linkv", eta_base = 10, diag = false },
  { task = "echo", seed = 0, arm = "e2e1emb_lin", eta_base = 10, diag = false },
  { task = "echo", seed = 0, arm = "e2e1emb_linvW", eta_base = 10, diag = false },
  { task = "echo", seed = 0, arm = "e2e1emb_linxkv", eta_base = 10, diag = false },
  { task = "echo", seed = 0, arm = "e2e1emb_w600", eta_base = 10, diag = false },
  { task = "echo_ctrl", seed = 0, arm = "e2e1emb_ctrl", eta_base = 10, diag = false },
]
