# Whole-session CUDA smoke: five concurrent FO mains, legacy seeds 0–4.
experiment = "frs"
seed = 0

[frs]
process_name = "TTM-pool-75-podsmoke"
protocol = "frs-a-smoke-v2"
require_cuda = true
hard_grace_minutes = 3  # <=15 minute CUDA smoke including hard grace
device = "cuda"
workers = 5
threads_per_worker = 2
max_minutes = 12  # checked every update; hard grace ends at 15 minutes
tf32 = false
mps_memory_fraction = 0.20  # inert on CUDA
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 65
batch = 32
n_keys = 16
n_eval = 4
n_val = 4
n_quick_eval = 64
eval_batch = 32
n_probe = 32
lr = 0.001
lr_total = 3000
warmup = 200
lr_floor = 0.1
eta_lr = 0.0
grad_clip = 1.0
g_clip = 10.0
copy_noise_q = [0.99, 0.97, 0.95, 0.90]
rf_probability = 0.05
log_every = 5
probe_every = 25
cross_every = 25
chunk_early = 5
chunk_late = 6
fork_arms = []
fork_acc = 0.90
rp_cap = 1000.0
mediation_p = 0.5  # G2 per-event mediation set (eval-only, every main final)
mediation_cap = 1000.0
ckpt_steps = [100, 125, 150, 175, 200, 225, 250, 275, 300, 325, 350, 375, 400, 425, 450, 475, 500, 525, 550, 575, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500]
ckpt_dense_arms = ["e2e1emb"]
ckpt_steps_sparse = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500]
branch_ckpt_every = 100
branch_ckpt_tags = ["rp03", "nc03"]
output_dir = "outputs/pool-podsmoke"
smoke_attempt_subdir = true
smoke_only = true
resume = false
h5_limit = 1
job_modules = ["tttmem.trg_pool", "tttmem.exp_rdo"]
coverage_factory = "tttmem.trg_pool:create_logger"
backend_factory = "tttmem.trg_pool:create_backend"
trg_kappa = 3
trg_smoke_horizon = 20
trg_smoke_so_stop = 40
trigger_bind = 0.0
trigger_residual = 2.0
smoke_force_loss = true
coverage_span = 20
coverage_tail = 10
so_coverage_stop = 40
determinism_probe = true  # descriptive only: SO seed 0 repeated from step 0
determinism_horizon = 20  # both repeats share the session's 12+3 minute cap
cells = [
  { task = "echo", seed = 0, arm = "e2e1emb", eta_base = 40 },
  { task = "echo", seed = 1, arm = "e2e1emb", eta_base = 40 },
  { task = "echo", seed = 2, arm = "e2e1emb", eta_base = 40 },
  { task = "echo", seed = 3, arm = "e2e1emb", eta_base = 40 },
  { task = "echo", seed = 4, arm = "e2e1emb", eta_base = 40 },
  { task = "echo", seed = 0, arm = "e2e2emb", eta_base = 40 },
  { task = "echo", seed = 0, arm = "e2e1emb_cn97", eta_base = 40 },
]
[frs.cross_rules]
e2e1emb = ["rp03"]
e2e2emb = ["rp03"]
e2e1emb_cn97 = ["rs01"]

[frs.final_rules]
e2e1emb = ["rp03", "rp10"]
e2e2emb = ["rp03", "rp10"]
e2e1emb_cn97 = ["rs01", "rp03"]

[frs.rdo_rpe]
candidate_seeds = [0]
limit = 1
horizon = 20
late_horizon = 20
late = true
