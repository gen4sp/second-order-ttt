experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r44b-01-podsmoke"
device = "cuda"
workers = 6
max_minutes = 20
tf32 = false
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 60
batch = 32
n_keys = 16
n_eval = 16
n_val = 16
n_quick_eval = 8
eval_batch = 32
lr = 0.001
eta_lr = 0.01
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.01
warmup = 200
lr_total = 3000
lr_floor = 0.1
grad_clip = 1.0
g_clip = 10.0
quick_every = 10
probe_every = 10
n_probe = 2
late_frac = 0.25
n_bins = 16

[ttt.icl_mc]
T = 1024
n_vocab = 32
alpha = 0.1
steps = 100
lr_total = 4000
n_eval = 16
n_val = 16
n_quick_eval = 8
eval_batch = 32
quick_every = 50
probe_every = 0

[ttt.wave_b]
enabled = true
smoke = true
preflight_workers = 2
memory_probe_workers = 6
memory_probe_steps = 2
max_device_usage_gib = 14.0
echo_seeds = [0]
echo_arms = ["e2e1emb", "e2e1emb_lin", "e2e1emb_aice"]
echo_eta_base = 10.0
echo_steps = 60
icl_seeds = [0]
icl_arms = ["e2e1", "e2e1_aice"]
icl_eta_base = 0.3
icl_steps = 100
kamin_seeds = [0]
kamin_smoke_fixed_switch = 30
kamin_stage1_cap = 2000
kamin_stage2_steps = 30
kamin_stage2_warmup = 25
kamin_probe_every = 10
kamin_trigger_sequences = 2
kamin_audit_sequences = 8
kamin_cap_failure_smoke_steps = 10
reassign_sequences = 16
reassign_eval_seed = 20250308
query_update_freeze = true
write_snapshot_eval = true
historical_lin_audit = true
checkpoint_input_manifest = "configs/toy/r4-4b/historical-manifest.json"
output_dir = "checkpoints/r44b-podsmoke"
smoke_receipt_path = "outputs/r44b-podsmoke/smoke-receipt.json"
lock_path = "outputs/TTM-r44b.lock"
