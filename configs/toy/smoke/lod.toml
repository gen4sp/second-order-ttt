experiment = "lod"
seed = 0
[lod]
mode = "diagnostic"
process_name = "TTM-lod-72-smoke"
device = "cpu"
output_dir = "outputs_lod_smoke"
workers = 1
threads_per_worker = 2
tf32 = false
d_model = 32
n_layers = 2
n_heads = 4
backbone_mult = 2
fast_mult = 2
window = 16
chunk = 16
pool = 64
loads = [8, 32]
n_probe = 4
events_per_chunk = 4
gap = 68
control_load = 32
steps = 10
batch = 2
n_eval = 4
n_quick_eval = 4
n_geometry = 4
eval_batch = 2
log_every = 5
lr = 0.001
eta_lr = 0.0
warmup = 2
lr_total = 30
lr_floor = 0.1
grad_clip = 1.0
g_clip = 10.0
