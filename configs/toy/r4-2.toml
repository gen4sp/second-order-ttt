experiment = "ttt"
seed = 0

[ttt]
process_name = "TTM-r42-01"
device = "auto"
workers = 3
max_minutes = 180
# torch's MPS fraction is relative to Metal's recommendedMaxWorkingSetSize (logged per
# worker as MPS_CAP), not to RAM. One echo process holds ≈ 2.3 GB of MPS driver memory;
# 0.20 caps each worker near 5 GiB, ≈ 15 GiB for three workers on the 36 GB machine.
mps_memory_fraction = 0.20
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 1500
batch = 32
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
lr = 0.001
lr_total = 3000
warmup = 200
lr_floor = 0.1
eta_lr = 0.01
grad_clip = 1.0
g_clip = 10.0
quick_every = 25
probe_every = 25
n_probe = 32
checkpoint_steps = [100, 200, 250, 300, 500, 1000]
checkpoint_steps_so = [50, 150, 200, 300, 1000]
