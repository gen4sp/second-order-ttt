experiment = "trg"
seed = 0

[trg]
process_name = "TTM-trg-80"
protocol = "trg-stage-i-v2"
device = "cuda"
require_cuda = true
workers = 5
max_minutes = 80.0
hard_grace_minutes = 10.0
threads_per_worker = 2
tf32 = false
smoke_only = false
resume = true
probes = true
fork_dir = "data/trg-inputs/checkpoints"
chr_log_path = "data/trg-inputs/chr-full.log.gz"
historical_series_path = "data/trg-inputs/chr_series.csv"
output_dir = "outputs/trg-output"
eta = 40.0
horizon = 305
so_end = 660
so_ladder_every = 5
ladder_cap = 300
d_model = 128
n_layers = 4
n_heads = 4
backbone_mult = 4
fast_mult = 4
window = 64
chunk = 64
T = 512
steps = 1500
batch = 32
n_keys = 16
n_eval = 256
n_val = 64
n_quick_eval = 64
eval_batch = 32
n_probe = 32
lr = 0.001
lr_total = 3000
warmup = 200
lr_floor = 0.1
eta_lr = 0.0
grad_clip = 1.0
g_clip = 10.0
